    const BRANDS = [{"label":"Ralph Lauren","terms":["ralph lauren"," ralph "," rl "]},{"label":"Tommy Hilfiger","terms":["tommy hilfiger","tommy"]},{"label":"Lacoste","terms":["lacoste"," lct "]},{"label":"Calvin Klein","terms":["calvin klein"," ck "]},{"label":"Hugo Boss","terms":["hugo boss"," hb "]},{"label":"Aramis","terms":["aramis"," arm "]},{"label":"Scorsatto","terms":["scorsatto"]}];
    const topbar = document.querySelector("#topbar");
    const heroLogo = document.querySelector("#heroLogo");
    const grid = document.querySelector("#grid");
    const count = document.querySelector("#count");
    const empty = document.querySelector("#empty");
    const search = document.querySelector("#search");
    const categoryChips = document.querySelector("#categoryChips");
    const sideFilters = document.querySelector("#sideFilters");
    const clearFilters = document.querySelector("#clearFilters");
    const cartMini = document.querySelector("#cartMini");
    const cartDrawer = document.querySelector("#cartDrawer");
    const cartItems = document.querySelector("#cartItems");
    const cartTotal = document.querySelector("#cartTotal");
    const cartClose = document.querySelector("#cartClose");
    const checkout = document.querySelector("#checkout");
    const whatsappFloat = document.querySelector("#whatsappFloat");
    let active = "todos";
    let selected = { spec: new Set(), brand: new Set(), size: new Set() };
    let cart = JSON.parse(localStorage.getItem("scorsattoCart") || "[]");

    const currency = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
    const normalize = (value) => String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    const colorFromName = (name) => name.includes(" - ") ? name.split(" - ").slice(1).join(" - ") : "Cor sob consulta";
    const cleanName = (name) => name.includes(" - ") ? name.split(" - ")[0] : name;
    const productText = (product) => normalize([product.name, product.collection, product.shortDescription, product.description, product.supplierUrl, product.images?.join(" "), product.internalNotes, product.tags?.join(" ")].join(" "));

    function termMatch(product, option) {
      if (!option) return false;
      const text = " " + productText(product) + " ";
      return option.terms.some((term) => text.includes(normalize(term)));
    }

    function categoryMatches(product, slug) {
      if (slug === "todos") return true;
      const category = CATEGORIES.find((item) => item.slug === slug);
      return category?.collection ? product.collection === category.collection : true;
    }

    function currentCategory() {
      return CATEGORIES.find((item) => item.slug === active) ?? CATEGORIES[0];
    }

    function baseCategoryProducts() {
      return PRODUCTS.filter((product) => categoryMatches(product, active));
    }

    function optionCount(kind, value, products = baseCategoryProducts()) {
      if (kind === "size") return products.filter((product) => product.sizes?.includes(value)).length;
      const list = kind === "brand" ? BRANDS : currentCategory().specs ?? [];
      const option = list.find((item) => item.label === value);
      return option ? products.filter((product) => termMatch(product, option)).length : 0;
    }

    function clearSelected() {
      selected = { spec: new Set(), brand: new Set(), size: new Set() };
    }

    function setFilter(slug) {
      active = slug;
      search.value = "";
      clearSelected();
      document.querySelectorAll("[data-filter]").forEach((chip) => chip.classList.toggle("active", chip.dataset.filter === active));
      document.querySelectorAll(".nav-link").forEach((link) => link.classList.toggle("active", link.dataset.filterLink === active));
      renderFilters();
      renderProducts();
    }

    function filterGroup(title, kind, options) {
      if (!options.length) return "";
      return `
        <div class="filter-group">
          <p class="filter-group-title">${title}</p>
          <div class="side-options">
            ${options.map((option) => {
              const value = typeof option === "string" ? option : option.label;
              const count = optionCount(kind, value);
              const activeClass = selected[kind].has(value) ? " active" : "";
              return `<button class="side-option${activeClass}" type="button" data-side-kind="${kind}" data-side-value="${value}" ${count ? "" : "disabled"}><span>${value}</span><span class="mark" aria-hidden="true"></span></button>`;
            }).join("")}
          </div>
        </div>`;
    }

    function renderFilters() {
      const category = currentCategory();
      const products = baseCategoryProducts();
      const specs = category.specs?.filter((option) => products.some((product) => termMatch(product, option))) ?? [];
      const availableBrands = BRANDS.filter((brand) => products.some((product) => termMatch(product, brand)));
      const sizes = [...new Set(products.flatMap((product) => product.sizes ?? []))].sort((a, b) => a.localeCompare(b, "pt-BR", { numeric: true }));
      sideFilters.innerHTML = [
        category.specLabel ? filterGroup(category.specLabel, "spec", specs) : "",
        filterGroup("Marcas", "brand", availableBrands),
        filterGroup("Tamanhos", "size", sizes),
      ].join("") || "<p class='muted'>Escolha uma categoria para refinar a selecao.</p>";
    }

    function productPassesSideFilters(product) {
      if (selected.spec.size) {
        const specs = currentCategory().specs ?? [];
        if (![...selected.spec].some((value) => termMatch(product, specs.find((item) => item.label === value)))) return false;
      }
      if (selected.brand.size) {
        if (![...selected.brand].some((value) => termMatch(product, BRANDS.find((item) => item.label === value)))) return false;
      }
      if (selected.size.size) {
        if (![...selected.size].some((value) => product.sizes?.includes(value))) return false;
      }
      return true;
    }

    function addToCart(slug) {
      const product = PRODUCTS.find((item) => item.slug === slug);
      if (!product || cart.some((item) => item.slug === slug)) return;
      cart.push(product);
      saveCart();
      openCart();
    }

    function removeFromCart(slug) {
      cart = cart.filter((item) => item.slug !== slug);
      saveCart();
    }

    function saveCart() {
      localStorage.setItem("scorsattoCart", JSON.stringify(cart));
      renderCart();
    }

    function openCart() { cartDrawer.classList.add("open"); }
    function closeCart() { cartDrawer.classList.remove("open"); }

    function renderCart() {
      cartMini.textContent = cart.length;
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      cartTotal.textContent = cart.length ? cart.length + " peca(s) - " + currency.format(total) : "Seu carrinho esta vazio.";
      cartItems.innerHTML = cart.length ? cart.map((item) => `
        <div class="cart-item">
          <img src="${item.images?.[0] || ""}" alt="${item.name}">
          <div><strong>${item.name}</strong><small>${currency.format(item.price)} · Tam: ${item.sizes?.join(", ") || "consultar"}</small></div>
          <button class="remove" type="button" data-remove="${item.slug}">remover</button>
        </div>
      `).join("") : "<p class='muted'>Adicione produtos para montar seu pedido.</p>";
    }

    function checkoutWhatsApp() {
      const message = cart.length
        ? "Ola, gostaria de finalizar este pedido na Scorsatto:%0A%0A" + cart.map((item, index) => (index + 1) + ". " + item.name + " - " + currency.format(item.price) + " - Tamanhos disponiveis: " + (item.sizes?.join(", ") || "consultar")).join("%0A")
        : "Ola, gostaria de conhecer a colecao da Scorsatto.";
      window.open("https://wa.me/5554997055401?text=" + message, "_blank", "noreferrer");
    }

    function renderProducts() {
      const term = normalize(search.value);
      const list = PRODUCTS.filter((product) => {
        const matchesFilter = categoryMatches(product, active);
        const haystack = productText(product) + " " + normalize(product.sizes?.join(" "));
        return matchesFilter && productPassesSideFilters(product) && (!term || haystack.includes(term));
      });
      count.textContent = list.length + " pecas";
      empty.style.display = list.length ? "none" : "block";
      grid.innerHTML = list.map((product, index) => `
        <article class="product-card" style="animation-delay: ${Math.min(index, 16) * 24}ms">
          <div class="product-media">
            <img src="${product.images?.[0] || ""}" alt="${product.name}" loading="lazy">
            <button class="quick-buy" type="button" data-add="${product.slug}">Adicionar</button>
          </div>
          <div class="product-info">
            <div class="product-top"><h3 class="product-name">${cleanName(product.name)}</h3><div class="price">${currency.format(product.price)}</div></div>
            <div class="details">${colorFromName(product.name)}<br>Tamanhos: ${product.sizes?.join(", ") || "consultar"}</div>
          </div>
        </article>
      `).join("");
    }

    function updateScrollState() {
      const y = window.scrollY || 0;
      topbar.classList.toggle("is-scrolled", y > 24);
      const progress = Math.min(y / Math.max(window.innerHeight * .7, 1), 1);
      const scale = 1 - progress * .28;
      const opacity = 1 - progress * .28;
      heroLogo.style.transform = "scale(" + scale.toFixed(3) + ")";
      heroLogo.style.opacity = opacity.toFixed(3);
    }

    categoryChips.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-filter]");
      if (button) setFilter(button.dataset.filter);
    });
    document.querySelectorAll("[data-filter-link]").forEach((link) => link.addEventListener("click", () => setFilter(link.dataset.filterLink)));
    sideFilters.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-side-kind]");
      if (!button || button.disabled) return;
      const group = selected[button.dataset.sideKind];
      if (group.has(button.dataset.sideValue)) group.delete(button.dataset.sideValue);
      else group.add(button.dataset.sideValue);
      renderFilters();
      renderProducts();
    });
    clearFilters.addEventListener("click", () => {
      clearSelected();
      renderFilters();
      renderProducts();
    });
    grid.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-add]");
      if (button) addToCart(button.dataset.add);
    });
    cartItems.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-remove]");
      if (button) removeFromCart(button.dataset.remove);
    });
    cartMini.addEventListener("click", openCart);
    cartClose.addEventListener("click", closeCart);
    checkout.addEventListener("click", checkoutWhatsApp);
    whatsappFloat.addEventListener("click", () => window.open("https://wa.me/5554997055401?text=Ol%C3%A1%2C%20gostaria%20de%20conhecer%20a%20cole%C3%A7%C3%A3o%20da%20Scorsatto.", "_blank", "noreferrer"));
    search.addEventListener("input", renderProducts);
    window.addEventListener("scroll", updateScrollState, { passive: true });

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => { if (entry.isIntersecting) entry.target.classList.add("visible"); });
    }, { threshold: 0.16 });
    document.querySelectorAll(".reveal").forEach((element) => observer.observe(element));

    renderFilters();
    renderProducts();
    renderCart();
    updateScrollState();
  </script>
</body>
</html>
