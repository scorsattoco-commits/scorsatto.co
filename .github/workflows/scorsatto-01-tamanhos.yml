name: "SCORSATTO 01 — tamanhos e estoque"

on:
  schedule:
    - cron: "30 10 * * *" # 07:30 em São Paulo (UTC-3)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scorsatto-tamanhos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Atualizar somente tamanhos e estoque
        run: python scripts/update_supplier_sizes.py --apply --workers 12
      - name: Validar escopo da alteração
        run: |
          git show HEAD:index.html > /tmp/index-base.html
          python scripts/validate_size_update.py /tmp/index-base.html index.html
      - name: Atualizar painel diário
        run: python scripts/generate_cloud_automation_report.py
      - name: Publicar resultado seguro
        run: |
          git config user.name "scorsatto-automation[bot]"
          git config user.email "scorsatto-automation[bot]@users.noreply.github.com"
          git add index.html data/fornecedor-tamanhos previews/automacoes/painel-relatorios-diarios.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(automation): atualizar tamanhos e estoque"
          git push
